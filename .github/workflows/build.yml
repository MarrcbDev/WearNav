name: Build APK

on:
  push:
    branches: [ '**' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Limpiar archivos viejos del repo
        run: |
          cd app/src/main/java
          rm -rf com/marrdev/wearbrowser
          for f in com/marrdev/wearnav/*.kt; do
            case "$(basename "$f")" in
              MainActivity.kt|Store.kt|RingProgressView.kt|WearNavApp.kt) ;;
              *) echo "Borrando sobrante: $f"; rm -f "$f" ;;
            esac
          done

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Compilar release
        run: gradle assembleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: WearNav-apk
          path: app/build/outputs/apk/release/*.apk
